[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "manim-mcp"
version = "0.2.0"
description = "MCP server for rendering Manim animations — works with Claude Code and Claude Desktop"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "manim-mcp contributors" }]
requires-python = ">=3.10"

# Runtime dependencies:
#   mcp  — the official Anthropic MCP Python SDK (includes FastMCP)
#   manim — Manim Community Edition (the animation engine itself)
dependencies = [
    "mcp>=1.2.0",
    "manim>=0.18.0",
]

# Optional extras — install with: pip install manim-mcp[dev]
[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.4",
]

# This is the critical section that makes `uvx manim-mcp` work.
# When uv builds the package and looks for an entry point named "manim-mcp",
# it finds this, calls manim_mcp.server:main, and everything just runs.
[project.scripts]
manim-mcp = "manim_mcp.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/manim_mcp"]

# ── Ruff linter config ─────────────────────────────────────────────────────
[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

# ── Pytest config ──────────────────────────────────────────────────────────
[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
