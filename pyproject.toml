[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "manim-mcp"
version = "2.1.0"
description = "MCP server for rendering Manim animations — works with Claude Code and Claude Desktop"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "manim-mcp contributors" }]
requires-python = ">=3.11"

dependencies = [
    "mcp>=1.2.0,<2",
    "manim>=0.20.0,<0.23",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.4",
]

# Makes `uvx manim-mcp` work — uv finds this entry point and runs it
[project.scripts]
manim-mcp = "manim_mcp.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/manim_mcp"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
